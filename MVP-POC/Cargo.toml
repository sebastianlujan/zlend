[workspace]
members = [
    "crates/ogbank-core",
    "crates/ogbank-cli",
    "crates/ogbank-relayer",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
# OGBank internal
ogbank-core = { path = "crates/ogbank-core" }

# Zcash ecosystem
zcash_keys = { version = "0.12", features = ["orchard"] }
orchard = "0.12"
zcash_primitives = "0.26"
zcash_protocol = "0.7"
zcash_note_encryption = "0.4"
zip32 = "0.2"

# Cryptography
bip39 = { version = "2.2", features = ["rand"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
reddsa = { version = "0.5", features = ["frost"] }
frost-rerandomized = "0.6"
blake2b_simd = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async / networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"

# EVM
alloy = { version = "1", features = ["provider-http", "signers", "signer-local", "sol-types", "contract"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
